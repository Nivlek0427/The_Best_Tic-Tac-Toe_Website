<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="container">
    <h1 class="title">TIC<span>TAC</span>TOE</h1>
    <div class="scoreboard">
      <div class="score-block" id="score-x">
        <span class="score-label">X</span>
        <span class="score-num" id="x-score">0</span>
      </div>
      <div class="score-block draws">
        <span class="score-label">DRAWS</span>
        <span class="score-num" id="draw-score">0</span>
      </div>
      <div class="score-block" id="score-o">
        <span class="score-label">O</span>
        <span class="score-num" id="o-score">0</span>
      </div>
    </div>
    <div class="status" id="status">Player X's turn</div>
    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
    <button class="reset-btn" id="reset-btn">NEW GAME</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
